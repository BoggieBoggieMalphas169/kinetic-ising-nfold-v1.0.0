name: full-ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Configure C simulator
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build C simulator
        run: cmake --build build --config Release
      - name: Run C/CTest suite
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Verify frozen release integrity
        run: python scripts/release_check.py --verify-frozen
      - name: Run Python tests
        run: pytest -q
      - name: Regenerate final 8D artifacts
        run: python -m scripts.reproduce_8D
      - name: Run structural release checks
        run: python scripts/release_check.py --structural
